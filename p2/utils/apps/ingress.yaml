apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-one-ingress
spec:
  entryPoints:
    - web 
  routes:
    - match: Host(`app1.com`)
      kind: Rule
      services:
        - name: app-one
          port: 80
